# Streamlit's own theme, set to the design system's tokens.
#
# This is not where the product is styled: asset_researcher/ui/theme.py
# generates the stylesheet, and it generates it from Python constants so a
# colour cannot drift between the CSS and the SVG charts. What this file
# controls is the frame Streamlit paints before that stylesheet arrives,
# and the chrome it owns outright.
#
# It has been wrong twice, in the same way both times. First it held a
# white page and a blue accent from before a redesign, so a cold load
# flashed white and settled onto cream. Then the shell was rebuilt and
# this file kept the cream, so a cold load flashed the palette of a
# design that no longer ships. A test now reads these values back out
# of the stylesheet's own tokens, because a frame painted in a
# retired world is the first impression of the page.
#
# Third time, 2026-11-21: the shell became The Broadsheet and this file
# still held the near-white ground AND #4f46e5 as the primary - which is
# Tailwind indigo-600, the most recognisable tell of a generated
# interface, painted before any of our own CSS arrives. Both now come
# from the stylesheet tokens, and the test reads both back.
#
# primaryColor mirrors --shell-focus and NOT --shell-accent, deliberately:
# Streamlit paints its own widget focus rings and the progress bar with
# it, and the accent is reserved for the divergence count and links. An
# accent on the progress bar would be the second place it appears, which
# is the point at which it stops reading as a signal.
[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f4f6f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#15161a"

[server]
headless = true
# The note is one long document and the export is a whole HTML file.
maxMessageSize = 300

[browser]
gatherUsageStats = false

[client]
# "none", not false. `false` is a legacy alias that Streamlit maps to
# "stacktrace": it redacts the exception message and still ships the type
# and the full traceback, with absolute paths and source lines, to the
# browser. Verified against streamlit 1.61.1,
# elements/exception.py:201-209. So the setting that was here did close to
# nothing, which is worse than knowing it does nothing.
showErrorDetails = "none"
