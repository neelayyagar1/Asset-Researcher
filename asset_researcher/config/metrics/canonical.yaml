# Canonical metric taxonomy, what a metric MEANS, independent of any company's
# XBRL tag names. Concept resolution (quant/resolve.py) maps a filer's actual
# XBRL concepts onto these canonical names; everything downstream (derived
# metrics, health scores, the financial table) reads canonical names only and
# never touches a raw XBRL tag.
#
# sectors: which sector classes use this metric. "all" = every sector class.
# kind: "line_item" = read directly from a resolved XBRL concept.
#       "derived"    = computed from other canonical metrics (see derived.py).

line_items:
  revenue:
    label: Revenue
    sectors: [all]
  cogs:
    label: Cost of Goods Sold
    sectors: [standard]
  gross_profit:
    label: Gross Profit
    sectors: [standard]
  operating_income:
    label: Operating Income
    sectors: [standard, energy]
  pretax_income:
    label: Income Before Income Taxes
    sectors: [standard, energy, financial, reit]
  income_tax_expense:
    label: Income Tax Expense
    sectors: [standard, energy, financial, reit]
  net_income:
    label: Net Income
    sectors: [all]
  eps_diluted:
    label: Diluted Earnings per Share
    sectors: [all]
  share_based_compensation:
    label: Share-based Compensation
    sectors: [standard, biotech]
  total_assets:
    label: Total Assets
    sectors: [all]
  total_liabilities:
    label: Total Liabilities
    sectors: [all]
  total_equity:
    label: Total Stockholders' Equity
    sectors: [all]
  current_assets:
    label: Current Assets
    sectors: [standard, energy]
  current_liabilities:
    label: Current Liabilities
    sectors: [standard, energy]
  cash_and_equivalents:
    label: Cash & Equivalents
    sectors: [all]
  short_term_investments:
    label: Short-term Investments
    sectors: [all]
  long_term_investments:
    label: Long-term Marketable Securities
    # Netted against debt only for non-financial filers. For a bank or an
    # insurer the investment portfolio is the operating business, not a cash
    # reserve, and netting it would understate leverage enormously.
    sectors: [standard, energy, biotech]
  total_debt:
    label: Total Debt
    sectors: [all]
  # combined_debt and short_term_debt have to be line items or they are
  # never built: build_metric_series only iterates the line items for the
  # sector, so a concept resolved for them was mapped and then discarded.
  # That left CompRow.combined_debt and .short_term_debt permanently None,
  # and once total_debt was narrowed to strictly non-current tags, any
  # peer tagging LongTermDebt or the combined amount reported gross debt
  # of zero and an enterprise value short by its entire debt load.
  combined_debt:
    label: Debt, long and short combined
    sectors: [all]
  short_term_debt:
    label: Short-term Debt
    sectors: [all]
  retained_earnings:
    label: Retained Earnings
    sectors: [all]
  depreciation_amortization:
    label: Depreciation & Amortization
    # reit included deliberately. ffo_before_disposals is net income plus
    # this line, and without reit here the line was never resolved for a
    # REIT, so FFO was always None: the one metric a REIT is actually
    # valued on was structurally unreachable.
    sectors: [standard, energy, reit]
  operating_cash_flow:
    label: Operating Cash Flow
    sectors: [all]
  capital_expenditures:
    label: Capital Expenditures
    sectors: [all]
  shares_diluted:
    label: Diluted Shares Outstanding
    sectors: [all]
  interest_expense:
    label: Interest Expense
    sectors: [standard, financial, reit, energy]
  accounts_receivable:
    label: Accounts Receivable
    sectors: [standard]

  # Financial-sector line items, no non-financial equivalent.
  net_interest_income:
    label: Net Interest Income
    sectors: [financial]
  provision_for_loan_losses:
    label: Provision for Loan Losses
    sectors: [financial]
  total_deposits:
    label: Total Deposits
    sectors: [financial]
  tier1_capital:
    label: Tier 1 Capital
    sectors: [financial]
  nonperforming_loans:
    label: Nonperforming Loans
    sectors: [financial]
  noninterest_expense:
    label: Noninterest Expense
    sectors: [financial]
  noninterest_income:
    label: Noninterest Income
    sectors: [financial]

  # REIT line items.
  real_estate_investments:
    label: Real Estate Investments, at Cost
    sectors: [reit]
  ffo_reported:
    label: FFO (as reported by the company, when tagged)
    sectors: [reit]

  # Energy line items.
  proved_reserves:
    label: Proved Reserves
    sectors: [energy]
  exploration_expense:
    label: Exploration Expense
    sectors: [energy]

derived:
  # name: canonical output name
  # formula: human-readable; actual arithmetic lives in quant/derived.py,
  #   kept here as the documented source of truth for what each computes.
  ebitda:
    label: EBITDA
    sectors: [standard, energy]
    formula: operating_income + depreciation_amortization
  fcf:
    label: Free Cash Flow
    sectors: [all]
    formula: operating_cash_flow - capital_expenditures
  fcf_conversion:
    label: FCF Conversion (FCF / Net Income)
    sectors: [standard, energy]
    formula: fcf / net_income
  net_debt:
    label: Net Debt
    sectors: [standard, energy, reit]
    formula: total_debt - cash_and_equivalents
  net_debt_to_ebitda:
    label: Net Debt / EBITDA
    sectors: [standard, energy]
    formula: net_debt / ebitda
  interest_coverage:
    label: Interest Coverage (EBIT / Interest Expense)
    sectors: [standard, energy]
    formula: operating_income / interest_expense
  working_capital:
    label: Working Capital
    sectors: [standard]
    formula: current_assets - current_liabilities
  roic:
    label: Return on Invested Capital
    sectors: [standard, energy]
    # NOPAT, not net income: net income is after interest, so dividing it by
    # capital that includes debt measures the capital structure as much as
    # the business. The tax rate is the filer's own, from pre-tax income and
    # tax expense, and the metric is unavailable where either is untagged.
    formula: operating_income * (1 - income_tax_expense / pretax_income) /
      (total_debt + total_equity - cash_and_equivalents)
  gross_margin:
    label: Gross Margin
    sectors: [standard]
    formula: gross_profit / revenue
  operating_margin:
    label: Operating Margin
    sectors: [standard, energy]
    formula: operating_income / revenue
  net_margin:
    label: Net Margin
    sectors: [all]
    formula: net_income / revenue

  # Financial-sector derived.
  roe:
    label: Return on Equity
    sectors: [financial]
    # Named for what it computes. It was labelled return on tangible common
    # equity, and no tangible adjustment exists: goodwill is not a metric
    # here, so there is nothing to deduct.
    formula: net_income / total_equity
  efficiency_ratio:
    label: Efficiency Ratio
    sectors: [financial]
    formula: noninterest_expense / (net_interest_income + noninterest_income)
  nim_on_assets:
    label: Net Interest Income / Total Assets
    sectors: [financial]
    # The textbook denominator is average earning assets, which needs a loan
    # and securities balance this taxonomy does not carry. Total assets
    # stands in, so the result reads slightly low; the name says which
    # denominator was used rather than claiming the standard one.
    formula: net_interest_income / total_assets
  npl_ratio:
    label: Nonperforming Loan Ratio
    sectors: [financial]
    formula: nonperforming_loans / total_assets

  # REIT derived.
  ffo_before_disposals:
    label: FFO before gains on disposal
    sectors: [reit]
    # Without the gain-on-sale deduction the NAREIT definition carries:
    # gains on property sales are not a metric here, so for a REIT that sold
    # property during the year this runs high. Named for what it computes.
    formula: net_income + depreciation_amortization

  # Energy derived.
  capex_intensity:
    label: Capex Intensity (Capex / Revenue)
    sectors: [energy]
    formula: capital_expenditures / revenue
